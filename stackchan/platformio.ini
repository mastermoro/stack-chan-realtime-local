[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@7.0.1
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
build_unflags =
  -std=gnu++11
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DUART_SCLK_DEFAULT=UART_SCLK_XTAL
  -std=gnu++17
lib_deps =
  m5stack/M5Unified@0.2.19
  https://github.com/m5stack/StackChan-BSP.git#f7ed40e6f5d9a1d08440cb926f3a0865b81882f8
  links2004/WebSockets@2.7.3
  bblanchon/ArduinoJson@7.4.3
