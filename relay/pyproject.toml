[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-chan-realtime-local-relay"
version = "0.2.0"
description = "Windows LAN relay, local tool host, and Foundry orchestrator for Stack-chan"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "openai[realtime]>=1.0",
  "azure-identity>=1.20",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyserial>=3.5",
  "websockets>=15,<16",
]

[project.optional-dependencies]
headset = [
  "sounddevice>=0.5",
]
firmware = [
  "platformio>=6.1",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools]
py-modules = ["headset_test", "local_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
