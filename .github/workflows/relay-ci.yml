name: relay-ci

on:
  pull_request:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-ci.yml'
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: relay/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: pytest -q
      - run: docker build -t stackchan-relay:test .
