name: bicep-ci

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/bicep-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/bicep-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-bicep@v2
      - run: bicep build infra/main.bicep
